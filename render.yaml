services:
  - type: web
    name: shiftboard
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: shiftboard-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TZ
        value: America/Denver
